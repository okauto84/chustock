<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChuStock</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.86.2/build/stlite.css"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #boot {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #495057;
        padding: 1.5rem;
      }
      #boot.error {
        color: #c92a2a;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="boot">ChuStock을 불러오는 중입니다…</div>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.86.2/build/stlite.js";

      const boot = document.getElementById("boot");
      const root = document.getElementById("root");

      // 정적 호스팅에서도 index.py와 동일하게 동작하도록 필요한 파일을 마운트한다.
      const APP_FILES = [
        "index.py",
        "tab01_analy.py",
        "tab02_search.py",
        "tab03_select.py",
        "tab04_adm.py",
        ".streamlit/config.toml",
        "data/stock/010_SectorList.json",
        "data/stock/020_StockList.json",
      ];

      // secrets는 배포 환경에 파일이 있을 때만 선택적으로 올린다.
      const OPTIONAL_FILES = [".streamlit/secrets.toml"];

      function setBoot(message, isError = false) {
        boot.textContent = message;
        boot.classList.toggle("error", isError);
        boot.style.display = message ? "block" : "none";
      }

      async function loadFiles(paths, required) {
        const files = {};
        for (const path of paths) {
          setBoot(`파일 로딩: ${path}`);
          const response = await fetch(path, { cache: "no-cache" });
          if (!response.ok) {
            if (required) {
              throw new Error(`${path} 로드 실패 (HTTP ${response.status})`);
            }
            continue;
          }
          files[path] = await response.text();
        }
        return files;
      }

      try {
        const files = {
          ...(await loadFiles(APP_FILES, true)),
          ...(await loadFiles(OPTIONAL_FILES, false)),
        };

        setBoot("Streamlit(stlite) 엔진을 시작하는 중입니다…");
        await mount(
          {
            entrypoint: "index.py",
            files,
            // streamlit은 stlite에 포함되어 있어 추가 설치하지 않는다.
            requirements: [],
            streamlitConfig: {
              "client.toolbarMode": "minimal",
              "browser.gatherUsageStats": false,
              "server.fileWatcherType": "none",
            },
          },
          root
        );
        setBoot("");
      } catch (error) {
        console.error(error);
        setBoot(
          `ChuStock을 시작하지 못했습니다.\n${error?.message || error}\n\n` +
            "이 폴더 전체를 정적 웹호스팅(또는 python -m http.server)으로 제공해야 합니다.\n" +
            "Supabase 접속이 필요하면 .streamlit/secrets.toml 을 함께 배포하세요.\n" +
            "주의: 브라우저에서 동작하므로 service_role 키는 넣지 말고 anon 키만 사용하세요.",
          true
        );
      }
    </script>
  </body>
</html>
